name: "publish"

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, ubuntu-22.04, windows-latest]

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5

      - name: setup node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: install frontend dependencies
        run: npm ci

      - name: check frontend
        run: npm run check

      - name: test frontend
        run: npm test

      - name: check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      - name: lint Rust
        run: cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings

      - name: test Rust
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: "Lymic v__VERSION__"
          releaseDraft: true
          prerelease: false
          generateReleaseNotes: true
          updaterJsonPreferNsis: true
          args: -- --locked

      - name: build Store x64 executable (windows only)
        if: matrix.platform == 'windows-latest'
        env:
          LYMIC_RELEASE_CHANNEL: store
        run: |
          npm run build
          cargo build --manifest-path src-tauri/Cargo.toml --release --locked

      - name: package and validate MSIX (windows only)
        if: matrix.platform == 'windows-latest'
        shell: powershell
        run: |
          $ver = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          ./scripts/package-msix.ps1 -Version $ver -OutputDir dist/msix
          ./scripts/validate-msix.ps1 -MsixPath "dist/msix/Lymic_${ver}_x64.msix" -ExpectedVersion $ver

      - name: upload MSIX artifact (windows only)
        if: matrix.platform == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: lymic-store-msix
          path: dist/msix/*.msix

      - name: attach MSIX to release (windows only)
        if: matrix.platform == 'windows-latest'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: powershell
        run: |
          $ver = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $msix = "dist/msix/Lymic_${ver}_x64.msix"
          if (Test-Path $msix) {
            gh release upload "v$ver" $msix --clobber
          }

      - name: validate Snapcraft configuration (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: npx vitest run src/lib/release/snapcraft-validator.test.ts

      - name: build Snap package (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        uses: snapcore/action-build@v1
        id: build-snap

      - name: upload Snap artifact (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        uses: actions/upload-artifact@v4
        with:
          name: lymic-snap
          path: ${{ steps.build-snap.outputs.snap }}

      - name: attach Snap to release (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ver=$(node -p 'require("./package.json").version')
          if [ -f "${{ steps.build-snap.outputs.snap }}" ]; then
            gh release upload "v$ver" "${{ steps.build-snap.outputs.snap }}" --clobber
          fi

      - name: publish Snap to Snap Store (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04' && secrets.SNAPCRAFT_STORE_CREDENTIALS != ''
        uses: snapcore/action-publish@v1
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        with:
          snap: ${{ steps.build-snap.outputs.snap }}
          release: candidate,stable

